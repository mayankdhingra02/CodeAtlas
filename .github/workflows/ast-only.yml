name: AST-only tests

on:
  push:
    branches: [research/ast-only-clean]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: codeatlas-ast index .
      - run: codeatlas-ast retrieve . "Where is the AST index built?" --max-tokens 800 --json
