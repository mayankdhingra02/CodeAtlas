name: Canonical flow trace CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/canonical-flow-trace.yml"
  push:
    branches:
      - main
      - feat/canonical-flow-trace-v1
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/canonical-flow-trace.yml"

permissions:
  contents: read

concurrency:
  group: canonical-flow-trace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and targeted static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install reproducible test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "tree-sitter==0.25.2" \
            "tree-sitter-language-pack==1.9.1"
          python -m pip install --upgrade-strategy only-if-needed -e ".[dev]"

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -v

      - name: Check visualization JavaScript syntax
        run: node --check src/codeatlas/assets/visualization.js

      - name: Ruff canonical trace contract
        run: |
          python -m ruff check \
            src/codeatlas/flow_trace.py \
            tests/test_flow_trace.py

      - name: Ruff imports in touched legacy files
        run: |
          python -m ruff check --select I001 \
            src/codeatlas/cli.py \
            src/codeatlas/mcp_server.py \
            src/codeatlas/storage.py \
            src/codeatlas/visualization.py \
            tests/test_benchmark_mcp.py \
            tests/test_visualization.py

      - name: Mypy canonical trace contract
        run: python -m mypy --follow-imports=skip src/codeatlas/flow_trace.py

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${GITHUB_SHA}"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
