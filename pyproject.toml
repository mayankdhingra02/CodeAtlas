[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas-ast"
version = "0.1.0"
description = "AST-only Python repository indexing and context retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codeatlas-ast = "codeatlas_ast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
